<!doctype html>
<html lang="en" data-theme="aetherlight">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Aetherfox CMS</title>

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bricolage-grotesque-800-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/00-tokens.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/01-fonts.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/02-reset.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/03-base.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/04-layout.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/05-components.css?v=1.0.0" />
    <link rel="stylesheet" href="/admin/admin.css?v=1.0.0" />

    <script>
      (() => {
        // El CMS sigue al tema del sistema, como la web pública. El conmutador
        // de la cabecera lo cambia y la elección se recuerda.
        const KEY = 'aetherfox:admin-theme';
        let stored = null;
        try {
          stored = localStorage.getItem(KEY);
        } catch {}
        const system = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'aetherdark'
          : 'aetherlight';
        document.documentElement.dataset.theme =
          stored === 'aetherdark' || stored === 'aetherlight' ? stored : system;
      })();
    </script>
  </head>
  <body class="adm">
    <a class="skip-link" href="#adm-main">Skip to content</a>

    <header class="adm-header">
      <div class="adm-header__inner">
        <a class="adm-brand" href="#/">
          <img src="/assets/images/brand/aetherfox-logo.webp" alt="" width="30" height="30" />
          <span>Aetherfox</span>
        </a>

        <nav class="adm-nav" aria-label="Main">
          <a href="#/collections" data-nav="collections">Contents</a>
          <a href="#/workflow" data-nav="workflow">Workflow</a>
          <a href="#/media" data-nav="media">Media</a>
        </nav>

        <div class="adm-header__actions">
          <button class="btn adm-new" type="button" data-new hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
            New entry
          </button>
          <div class="adm-user">
            <button
              class="adm-iconbtn"
              type="button"
              data-theme-toggle
              aria-label="Cambiar de tema"
              title="Cambiar de tema"
            >
              <svg class="icon" aria-hidden="true" data-theme-icon><use href="#i-sun" /></svg>
            </button>
            <button
              class="adm-avatar"
              type="button"
              data-menu-toggle
              aria-haspopup="menu"
              aria-expanded="false"
              aria-label="Account"
              hidden
            >
              <img src="" alt="" width="28" height="28" />
            </button>
            <div class="adm-menu" data-menu role="menu" hidden>
              <div class="adm-menu__user">
                <strong data-menu-name></strong>
                <span data-menu-login></span>
              </div>
              <button class="adm-menu__item" type="button" role="menuitem" data-signout>
                <svg class="icon" aria-hidden="true"><use href="#i-exit" /></svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="adm-main" id="adm-main">
      <div class="adm-view" data-view>
        <p class="adm-loading">Loading…</p>
      </div>
    </main>
