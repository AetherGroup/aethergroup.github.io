<!doctype html>
<html lang="en" data-theme="aetherlight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Aetherfox CMS</title>

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bricolage-grotesque-800-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/01-fonts.css?v=1.0.0" />
    <link rel="stylesheet" href="/admin/admin.css?v=1.0.0" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('aetherfox:theme');
          const pref = stored ? JSON.parse(stored) : 'auto';
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'aetherdark' : 'aetherlight';
          document.documentElement.dataset.theme = !pref || pref === 'auto' ? system : pref === 'aetherdark' ? 'aetherdark' : 'aetherlight';
        } catch {
          document.documentElement.dataset.theme = 'aetherlight';
        }
      })();
    </script>
  </head>
  <body>
    <div class="aether-art" aria-hidden="true">
      <div class="aether-art__window">
        <div class="aether-art__tabs"><span class="on"></span><span></span></div>
        <div class="aether-art__bar">https://example.com</div>
        <div class="aether-art__page">
          <img src="/assets/images/brand/aetherfox-logo.webp" alt="" width="92" height="90" />
          <b>Welcome to Aetherfox</b>
          <span>Pick up where you left off.</span>
        </div>
      </div>
      <div class="aether-art__shields">
        <div class="aether-art__shields-title">Aetherfox Shields</div>
        <div class="aether-art__shield"><i></i><span>Canvas images</span></div>
        <div class="aether-art__shield"><i></i><span>Text measurements</span></div>
        <div class="aether-art__shield"><i></i><span>3D graphics</span></div>
        <div class="aether-art__shield"><i></i><span>Audio</span></div>
      </div>
    </div>

    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
