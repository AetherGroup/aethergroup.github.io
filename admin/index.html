<!doctype html>
<html lang="en" data-theme="aetherlight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Aetherfox CMS</title>

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plus-jakarta-sans-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bricolage-grotesque-800-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/00-tokens.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/01-fonts.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/02-reset.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/03-base.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/04-layout.css?v=1.0.0" />
    <link rel="stylesheet" href="/assets/css/05-components.css?v=1.0.0" />
    <link rel="stylesheet" href="/admin/admin.css?v=1.0.0" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('aetherfox:theme');
          const pref = stored ? JSON.parse(stored) : 'auto';
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'aetherdark' : 'aetherlight';
          document.documentElement.dataset.theme = !pref || pref === 'auto' ? system : pref === 'aetherdark' ? 'aetherdark' : 'aetherlight';
        } catch {
          document.documentElement.dataset.theme = 'aetherlight';
        }
      })();
    </script>
  </head>
  <body class="adm">
    <a class="skip-link" href="#adm-main">Skip to content</a>

    <header class="adm-header">
      <div class="adm-header__inner">
        <a class="adm-brand" href="#/">
          <img src="/assets/images/brand/aetherfox-logo.webp" alt="" width="30" height="30" />
          <span>Aetherfox</span>
        </a>

        <nav class="adm-nav" aria-label="Main">
          <a href="#/collections" data-nav="collections">Contents</a>
          <a href="#/workflow" data-nav="workflow">Workflow</a>
          <a href="#/media" data-nav="media">Media</a>
        </nav>

        <div class="adm-header__actions">
          <button class="btn adm-new" type="button" data-new hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
            New entry
          </button>
          <div class="adm-user">
            <button
              class="adm-avatar"
              type="button"
              data-menu-toggle
              aria-haspopup="menu"
              aria-expanded="false"
              aria-label="Account"
              hidden
            >
              <img src="" alt="" width="28" height="28" />
            </button>
            <div class="adm-menu" data-menu role="menu" hidden>
              <div class="adm-menu__user">
                <strong data-menu-name></strong>
                <span data-menu-login></span>
              </div>
              <button class="adm-menu__item" type="button" role="menuitem" data-signout>
                <svg class="icon" aria-hidden="true"><use href="#i-exit" /></svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="adm-main" id="adm-main">
      <div class="adm-view" data-view>
        <p class="adm-loading">Loading…</p>
      </div>
    </main>

    <div class="adm-toasts" data-toasts></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-dl" viewBox="0 0 24 24">
          <path d="M12 4.5v9M8.3 10l3.7 3.7 3.7-3.7M5.5 17.5v1A1.5 1.5 0 0 0 7 20h10a1.5 1.5 0 0 0 1.5-1.5v-1" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M19 12H5M10.5 6.5L5 12l5.5 5.5" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-exit" viewBox="0 0 24 24">
          <path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M10 12h11m0 0-3-3m3 3-3 3" />
        </symbol>
        <symbol id="i-github" viewBox="0 0 24 24">          <path
            fill="currentColor"
            stroke="none"
            d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.1-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 3.1.2 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"
          />
        </symbol>
      </defs>
    </svg>

    <script type="module" src="/admin/app.js?v=1.0.0"></script>
  </body>
</html>
