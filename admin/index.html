    <script>
      (() => {
        // El CMS sigue al tema del sistema, como la web pública. El conmutador
        // de la cabecera lo cambia y la elección se recuerda.
        const KEY = 'aetherfox:admin-theme';
        let stored = null;
        try {
          stored = localStorage.getItem(KEY);
        } catch {}
        const system = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'aetherdark'
          : 'aetherlight';
        document.documentElement.dataset.theme =
          stored === 'aetherdark' || stored === 'aetherlight' ? stored : system;
      })();
    </script>
  </head>
  <body class="adm">
    <a class="skip-link" href="#adm-main">Skip to content</a>

    <header class="adm-header">
      <div class="adm-header__inner">
        <a class="adm-brand" href="#/">
          <img src="/assets/images/brand/aetherfox-logo.webp" alt="" width="28" height="28" />
          <span class="adm-brand__name">Aetherfox</span>
          <span class="adm-brand__tag">CMS</span>
        </a>

        <nav class="adm-nav" aria-label="Sections">
          <a href="#/" data-nav="contents">Contents</a>
          <a href="#/workflow" data-nav="workflow">Workflow</a>
          <a href="#/media" data-nav="media">Media</a>
        </nav>

        <div class="adm-search" data-search hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
          <input
            type="search"
            placeholder="Search content"
            aria-label="Search content"
            autocomplete="off"
            data-search-input
          />
        </div>

        <div class="adm-header__actions">
          <div class="adm-newmenu" data-newmenu>
            <button
              class="btn adm-new"
              type="button"
              data-new-toggle
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
              New entry
              <svg class="icon adm-new__chev" aria-hidden="true"><use href="#i-chev" /></svg>
            </button>
            <div class="adm-newmenu__list" role="menu" hidden data-new-list></div>
          </div>

          <div class="adm-user">
            <button
              class="adm-iconbtn"
              type="button"
              data-theme-toggle
              aria-label="Cambiar de tema"
              title="Cambiar de tema"
            >
              <svg class="icon" aria-hidden="true" data-theme-icon><use href="#i-sun" /></svg>
            </button>
            <button
              class="adm-avatar"
              type="button"
              data-menu-toggle
              aria-haspopup="menu"
              aria-expanded="false"
              aria-label="Account"
              hidden
            >
              <img src="" alt="" width="28" height="28" />
            </button>
            <div class="adm-menu" data-menu role="menu" hidden>
              <div class="adm-menu__user">
                <strong data-menu-name></strong>
                <span data-menu-login></span>
              </div>
              <button class="adm-menu__item" type="button" role="menuitem" data-signout>
                <svg class="icon" aria-hidden="true"><use href="#i-exit" /></svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="adm-main" id="adm-main">
      <div class="adm-view" data-view>
        <p class="adm-loading">Loading…</p>
      </div>

      <footer class="adm-footer">
        <span><code>AetherGroup/aethergroup.github.io</code> · <code>main</code></span>
        <span>Every change is a commit. The site rebuilds on every push.</span>
      </footer>
    </main>
